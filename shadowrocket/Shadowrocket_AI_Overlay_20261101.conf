# Shadowrocket AI policy overlay v1.1 — 2026-11-01
# FOR EXTENDING YOUR EXISTING default.conf ONLY.
# Contains NO subscription URLs, server credentials, or executable scripts.
# Import by URL, then in this file's General > Included Configuration choose default.conf.
# Do NOT enable as a standalone configuration before the include relationship is established.
# Inherited default.conf owns DNS, IPv6, Hosts, rewrites, and FINAL / mainland rules.
# Subscription node labels below must match the device's existing node names exactly.

[General]

[Proxy Group]
# Same-country failover for ordinary AI use; avoids unexpected Japan/Singapore oscillation.
AI-SG-Fallback = fallback, ASIA-Singapore-VLESS-13, ASIA-Singapore-VLESS-01, ASIA-Singapore-VLESS-02, interval=600, timeout=5, url=http://www.gstatic.com/generate_204

# Manual override for AI; first entry is the failover policy, not the Japan latency pool.
AI-Work = select, AI-SG-Fallback, ASIA-Singapore-VLESS-13, ASIA-Singapore-VLESS-01, ASIA-Singapore-VLESS-02, select=0

# Gemini keeps one selected regional exit instead of auto-rotating countries.
Gemini-Fixed = select, ASIA-Singapore-VLESS-13, AI-SG-Fallback, select=0

[Rule]
# Rules in this overlay should take precedence over inherited default.conf.
# ChatGPT and OpenAI, including voice and file uploads.
DOMAIN-SUFFIX,chatgpt.com,AI-Work
DOMAIN-SUFFIX,openai.com,AI-Work
DOMAIN-SUFFIX,oaistatic.com,AI-Work
DOMAIN-SUFFIX,oaiusercontent.com,AI-Work
DOMAIN-SUFFIX,oaistatsig.com,AI-Work
DOMAIN-SUFFIX,chatgpt.livekit.cloud,AI-Work

# Anthropic / Claude.
DOMAIN-SUFFIX,claude.ai,AI-Work
DOMAIN-SUFFIX,anthropic.com,AI-Work

# Google Gemini; intentionally NOT routing every google.com or googleapis.com request.
DOMAIN,gemini.google.com,Gemini-Fixed
DOMAIN,aistudio.google.com,Gemini-Fixed
DOMAIN,generativelanguage.googleapis.com,Gemini-Fixed

# IMPORTANT: Do not add FINAL,PROXY here.
# All unspecified traffic should continue to use the inherited default.conf.
