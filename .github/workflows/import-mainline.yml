name: Import decompressed A-share mainline

on:
  push:
    paths:
      - 'upload_parts/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and extract source package
        shell: python
        run: |
          from pathlib import Path
          import base64, zipfile
          parts = sorted(Path("upload_parts").glob("part_*.txt"))
          raw = base64.b64decode("".join(p.read_text(encoding="ascii") for p in parts))
          z = Path("mainline_source.zip")
          z.write_bytes(raw)
          with zipfile.ZipFile(z) as f:
              f.extractall(".")
          z.unlink()

      - name: Commit decompressed files and remove transport parts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            const parent = ref.data.object.sha;
            const commit = await github.rest.git.getCommit({owner, repo, commit_sha: parent});
            const baseTree = commit.data.tree.sha;

            function walk(dir) {
              let out = [];
              for (const name of fs.readdirSync(dir)) {
                if (name === '.git' || name === 'upload_parts') continue;
                const full = path.join(dir, name);
                const st = fs.statSync(full);
                if (st.isDirectory()) out = out.concat(walk(full));
                else out.push(full.replace(/\\/g, '/'));
              }
              return out;
            }

            const wanted = walk('.').filter(p =>
              p === 'OPEN_LATEST_CARD.bat' ||
              p === '运行_A股主线.bat' ||
              p.startsWith('mainline_v33/')
            );

            const tree = [];
            for (const p of wanted) {
              const blob = await github.rest.git.createBlob({
                owner, repo,
                content: fs.readFileSync(p).toString('base64'),
                encoding: 'base64'
              });
              tree.push({path: p, mode: '100644', type: 'blob', sha: blob.data.sha});
            }

            for (const p of fs.readdirSync('upload_parts')) {
              tree.push({path: 'upload_parts/' + p, mode: '100644', type: 'blob', sha: null});
            }

            const newTree = await github.rest.git.createTree({
              owner, repo, base_tree: baseTree, tree
            });
            const newCommit = await github.rest.git.createCommit({
              owner, repo,
              message: 'Import A-share mainline V3.3_SHSZ_REVIEW_FIX_1 (decompressed)',
              tree: newTree.data.sha,
              parents: [parent]
            });
            await github.rest.git.updateRef({
              owner, repo, ref: 'heads/main', sha: newCommit.data.sha
            });
